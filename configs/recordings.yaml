# Paths are relative to the repository root. Each example records its first episode.
defaults:
  agent: rsl_rl_student_ppo_cfg_entry_point
  publication: true
  video_length: 400  # Maximum policy steps; stop earlier on termination or timeout.
  seed: 0
  device: cuda:0
  timeout: 900      # Maximum wall seconds per attempt.
  crash_retries: 2

