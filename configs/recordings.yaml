    checkpoint: logs/rsl_rl/anymal_m30_thread_student_ppo/2026-10-02_08-33-09_student_ppo_v1/model_600.pt
  - name: circuit-breaker
    task: Isaac-HiveBoard-Anymal-CircuitBreaker-RL-Play-v0
